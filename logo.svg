<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0807"/>
      <stop offset="50%" stop-color="#19130d"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#ffcb1f"/>
      <stop offset="50%" stop-color="#d99b00"/>
      <stop offset="75%" stop-color="#ffcb1f"/>
      <stop offset="100%" stop-color="#996a00"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6f7ff"/>
      <stop offset="100%" stop-color="#00c8e0"/>
    </linearGradient>

    <!-- Crimson Flare Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Shield / Badge Outline -->
  <g filter="url(#dropShadow)">
    <path d="M 120 40 L 680 40 Q 720 40 730 80 L 680 300 Q 400 390 400 390 Q 400 390 120 300 L 70 80 Q 80 40 120 40 Z" 
          fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Inner Accent Border -->
    <path d="M 135 55 L 665 55 Q 695 55 705 90 L 660 285 Q 400 370 400 370 Q 400 370 140 285 L 95 90 Q 105 55 135 55 Z" 
          fill="none" stroke="#ffcb1f" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 6"/>
  </g>

  <!-- Speed Lines / Street Grid Background -->
  <g opacity="0.15" stroke="#ffcb1f" stroke-width="1.5">
    <line x1="400" y1="60" x2="200" y2="350"/>
    <line x1="400" y1="60" x2="300" y2="365"/>
    <line x1="400" y1="60" x2="400" y2="370"/>
    <line x1="400" y1="60" x2="500" y2="365"/>
    <line x1="400" y1="60" x2="600" y2="350"/>
  </g>

  <!-- The Royal Crown of Dhaka Streets -->
  <g filter="url(#dropShadow)" transform="translate(400, 95) scale(0.95)">
    <!-- Crown Base -->
    <path d="M -90 10 L -120 -40 L -60 -15 L 0 -65 L 60 -15 L 120 -40 L 90 10 Z" 
          fill="url(#goldGrad)" stroke="#5c3f00" stroke-width="2"/>
    <!-- Jewels on Crown Points -->
    <circle cx="-120" cy="-42" r="7" fill="#ff3fa4" filter="url(#neonGlow)"/>
    <circle cx="-60" cy="-17" r="6" fill="#2ee6ff" filter="url(#neonGlow)"/>
    <circle cx="0" cy="-68" r="9" fill="#ff4757" filter="url(#neonGlow)"/>
    <circle cx="60" cy="-17" r="6" fill="#2ee6ff" filter="url(#neonGlow)"/>
    <circle cx="120" cy="-42" r="7" fill="#ff3fa4" filter="url(#neonGlow)"/>
    <!-- Center Big Star/Ruby -->
    <polygon points="0,-35 7,-20 22,-20 11,-10 15,5 0,-5 -15,5 -11,-10 -22,-20 -7,-20" fill="#fff" opacity="0.9"/>
    <!-- Crown Rim Band -->
    <rect x="-92" y="10" width="184" height="12" rx="3" fill="#ffe259" stroke="#996a00" stroke-width="1.5"/>
    <circle cx="-60" cy="16" r="3" fill="#ff4757"/>
    <circle cx="-20" cy="16" r="3" fill="#2ee6ff"/>
    <circle cx="20" cy="16" r="3" fill="#ff4757"/>
    <circle cx="60" cy="16" r="3" fill="#2ee6ff"/>
  </g>

  <!-- Glowing Rickshaw/Auto Silhouette Grille -->
  <g transform="translate(400, 160)">
    <!-- Vehicle Hood Wing Accents -->
    <path d="M -160 30 Q -80 10 0 10 Q 80 10 160 30 L 150 48 Q 70 30 0 30 Q -70 30 -150 48 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
    <!-- Dual Neon Headlights -->
    <ellipse cx="-130" cy="55" rx="18" ry="10" fill="#fff" filter="url(#neonGlow)"/>
    <ellipse cx="-130" cy="55" rx="24" ry="14" fill="url(#cyanGrad)" opacity="0.4" filter="url(#neonGlow)"/>
    <ellipse cx="130" cy="55" rx="18" ry="10" fill="#fff" filter="url(#neonGlow)"/>
    <ellipse cx="130" cy="55" rx="24" ry="14" fill="url(#cyanGrad)" opacity="0.4" filter="url(#neonGlow)"/>
  </g>

  <!-- Primary Bengali Typography: রাস্তার রাজা -->
  <g filter="url(#dropShadow)">
    <!-- Back stroke shadow for 3D depth -->
    <text x="400" y="255" text-anchor="middle" 
          font-family="'Hind Siliguri', 'Baloo Da 2', 'Anek Bangla', 'Segoe UI', sans-serif" 
          font-size="92" font-weight="900" 
          fill="#1d1203" stroke="#000" stroke-width="12" stroke-linejoin="round" letter-spacing="2">
      রাস্তার রাজা
    </text>
    <!-- Foreground Golden Metallic Gradient Text -->
    <text x="400" y="255" text-anchor="middle" 
          font-family="'Hind Siliguri', 'Baloo Da 2', 'Anek Bangla', 'Segoe UI', sans-serif" 
          font-size="92" font-weight="900" 
          fill="url(#goldGrad)" stroke="#ffeaa7" stroke-width="1.5" letter-spacing="2">
      রাস্তার রাজা
    </text>
  </g>

  <!-- Subtitle Banner: RASTAR RAJA · KING OF DHAKA STREETS -->
  <g transform="translate(400, 290)">
    <!-- Ribbon Box -->
    <polygon points="-240,0 240,0 225,28 -225,28" fill="url(#redGrad)" stroke="#ffcb1f" stroke-width="1.5"/>
    <text x="0" y="20" text-anchor="middle" 
          font-family="'Share Tech Mono', 'Courier New', monospace" 
          font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="4">
      RASTAR RAJA · KING OF DHAKA STREETS
    </text>
  </g>

  <!-- Author Badge: BY ABDUL AL JUBAYER -->
  <g transform="translate(400, 340)">
    <text x="0" y="0" text-anchor="middle" 
          font-family="'Share Tech Mono', sans-serif" 
          font-size="12" font-weight="600" fill="#ffcb1f" letter-spacing="3" opacity="0.9">
      ★ A MASTERPIECE BY ABDUL AL JUBAYER ★
    </text>
  </g>
</svg>

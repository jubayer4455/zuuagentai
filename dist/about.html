<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Abdul Al Jubayer, Creator of রাস্তার রাজা (Rastar Raja) - ঢাকাইয়া রাজপথের সিমুলেশন গেম।">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.ecd6bb7b2b.png">

<style>
@font-face { font-family: 'Anek Bangla'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/anek-bangla-400-800-bengali.418c763509.woff2) format('woff2'); }
@font-face { font-family: 'Hind Siliguri'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/hind-siliguri-700-bengali.b6033f70da.woff2) format('woff2'); }
@font-face { font-family: 'Tiro Bangla'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/tiro-bangla-400-bengali.7132520bbc.woff2) format('woff2'); }
@font-face { font-family: 'Share Tech Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/share-tech-mono-400-latin.41e6b9f297.woff2) format('woff2'); }

:root { 
  --paper: #15110e; 
  --card: #1f1a16;
  --text: #f7efe0; 
  --muted: #a39585; 
  --gold: #ffcb1f; 
  --red: #e0242b; 
  --cyan: #2ee6ff;
  color-scheme: dark;
}
body { margin: 0; background: var(--paper); color: var(--text); font: 17px/1.6 "Anek Bangla", system-ui, sans-serif; }
main { max-width: 540px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px 48px; text-align: center; }
.mast { margin: 0; font-family: "Tiro Bangla", serif; font-size: clamp(32px, 8vw, 44px); color: var(--gold); border-bottom: 2px solid rgba(255,203,31,0.3); padding-bottom: 8px; }
.kicker { margin: 18px 0 14px; display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; color: var(--gold); letter-spacing: 2px; }
.portrait { position: relative; width: 140px; height: 140px; margin: 12px auto; border-radius: 24px; border: 3px solid var(--gold); background: #0a0807; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
h1 { margin: 16px 0 4px; font-size: 30px; font-family: "Hind Siliguri", sans-serif; color: #fff; }
.role { margin: 0; color: var(--muted); font-size: 16px; }
blockquote { margin: 20px auto; max-width: 26em; padding: 12px 16px; border-radius: 12px; background: var(--card); border: 1px solid rgba(255,203,31,0.2); }
blockquote p { margin: 0; font-family: "Tiro Bangla", serif; font-size: 18px; color: var(--gold); }
.collab { position: relative; margin: 24px auto 0; padding: 20px; border-radius: 16px; background: var(--card); border: 1.5px solid rgba(255,203,31,0.35); text-align: center; }
.collab-lead { margin: 0 0 16px; font-size: 15px; color: var(--text); line-height: 1.5; }
.collab-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.collab-links a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 8px; font-size: 15px; font-weight: 800; text-decoration: none; color: #000; background: var(--gold); transition: transform 0.15s ease; }
.collab-links a:hover { transform: translateY(-2px); }
.back { margin-top: 32px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.1); }
.back a { color: var(--gold); font-weight: bold; text-decoration: none; font-size: 18px; }
.back a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <p class="mast">রাস্তার রাজা</p>
  <p class="kicker">★ গেম ক্রিয়েটর &amp; ডেভেলপার ★</p>
  <figure class="portrait"><img src="icons/icon-192.8f96155b92.png" width="140" height="140" alt="Abdul Al Jubayer Logo"></figure>
  <h1>Abdul Al Jubayer</h1>
  <p class="role">Software Engineer &amp; Game Creator · ঢাকা, বাংলাদেশ</p>
  <blockquote>
    <p>“রাস্তা কারো বাপের না, কিন্তু এই রাজপথের আসল রাজা আমরাই!”</p>
  </blockquote>
  <section class="collab">
    <p class="collab-lead">গেম সম্পর্কিত পরামর্শ, কাস্টমাইজেশন বা কোলাবরেশনের জন্য যোগাযোগ করুন:</p>
    <div class="collab-links">
      <a href="mailto:jubayer@local">ইমেইল করুন</a>
      <a href="./" style="background:#2ee6ff;">গেমটি খেলুন</a>
    </div>
  </section>
  <p class="back"><a href="./">← গেমে ফিরে যান</a></p>
</main>
</body>
</html>

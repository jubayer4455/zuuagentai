<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15110e"/>
      <stop offset="50%" stop-color="#241b12"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="30%" stop-color="#ffcb1f"/>
      <stop offset="70%" stop-color="#d99b00"/>
      <stop offset="100%" stop-color="#996a00"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6f7ff"/>
      <stop offset="100%" stop-color="#00c8e0"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#b33939"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgSquare)" stroke="url(#gold)" stroke-width="8"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffcb1f" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8"/>

  <!-- Speed Light Rays -->
  <g opacity="0.2" stroke="#ffcb1f" stroke-width="2">
    <line x1="256" y1="80" x2="60" y2="440"/>
    <line x1="256" y1="80" x2="180" y2="460"/>
    <line x1="256" y1="80" x2="256" y2="470"/>
    <line x1="256" y1="80" x2="332" y2="460"/>
    <line x1="256" y1="80" x2="452" y2="440"/>
  </g>

  <!-- The Royal Crown of Dhaka Streets -->
  <g filter="url(#sh)" transform="translate(256, 150) scale(1.15)">
    <!-- Crown Base -->
    <path d="M -80 15 L -110 -35 L -55 -10 L 0 -55 L 55 -10 L 110 -35 L 80 15 Z" 
          fill="url(#gold)" stroke="#5c3f00" stroke-width="3"/>
    <!-- Jewels on Crown Points -->
    <circle cx="-110" cy="-35" r="7" fill="#ff3fa4" filter="url(#glow)"/>
    <circle cx="-55" cy="-10" r="6" fill="#2ee6ff" filter="url(#glow)"/>
    <circle cx="0" cy="-55" r="10" fill="#ff4757" filter="url(#glow)"/>
    <circle cx="55" cy="-10" r="6" fill="#2ee6ff" filter="url(#glow)"/>
    <circle cx="110" cy="-35" r="7" fill="#ff3fa4" filter="url(#glow)"/>
    <!-- Crown Rim Band -->
    <rect x="-82" y="15" width="164" height="14" rx="4" fill="#ffe259" stroke="#996a00" stroke-width="2"/>
    <circle cx="-50" cy="22" r="3.5" fill="#ff4757"/>
    <circle cx="-18" cy="22" r="3.5" fill="#2ee6ff"/>
    <circle cx="18" cy="22" r="3.5" fill="#ff4757"/>
    <circle cx="50" cy="22" r="3.5" fill="#2ee6ff"/>
  </g>

  <!-- Dual Neon Headlights -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <ellipse cx="-100" cy="25" rx="18" ry="10" fill="#fff"/>
    <ellipse cx="-100" cy="25" rx="26" ry="16" fill="url(#cyan)" opacity="0.4"/>
    <ellipse cx="100" cy="25" rx="18" ry="10" fill="#fff"/>
    <ellipse cx="100" cy="25" rx="26" ry="16" fill="url(#cyan)" opacity="0.4"/>
  </g>

  <!-- Bengali Title: রাস্তার রাজা -->
  <g filter="url(#sh)">
    <text x="256" y="325" text-anchor="middle" 
          font-family="'Hind Siliguri', 'Baloo Da 2', sans-serif" 
          font-size="78" font-weight="900" 
          fill="#1d1203" stroke="#000" stroke-width="12" stroke-linejoin="round">
      রাস্তার রাজা
    </text>
    <text x="256" y="325" text-anchor="middle" 
          font-family="'Hind Siliguri', 'Baloo Da 2', sans-serif" 
          font-size="78" font-weight="900" 
          fill="url(#gold)" stroke="#ffeaa7" stroke-width="2">
      রাস্তার রাজা
    </text>
  </g>

  <!-- English Subtitle Ribbon -->
  <g transform="translate(256, 375)">
    <polygon points="-170,-15 170,-15 155,15 -155,15" fill="url(#red)" stroke="#ffcb1f" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" 
          font-family="'Share Tech Mono', monospace" 
          font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3">
      RASTAR RAJA
    </text>
  </g>

  <!-- Author Signature Tag -->
  <text x="256" y="440" text-anchor="middle" 
        font-family="'Share Tech Mono', monospace" 
        font-size="14" font-weight="600" fill="#ffcb1f" letter-spacing="2" opacity="0.95">
    ABDUL AL JUBAYER
  </text>
</svg>
